name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # ponytail: full install for safety (torch is heavy); split out a
      # requirements-ci.txt only if install time becomes annoying.
      - run: pip install -r requirements.txt pytest
      # Contract + live-LLM tests self-skip when LLM_BASE_URL is unreachable.
      - run: PYTHONPATH=. python -m pytest tests/ -q
