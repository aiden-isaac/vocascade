system:
  role: "both"                  # both | edge | server
  transport_auth_mode: "trust-network"  # trust-network | device-identity
  server_vad_enabled: false


waterfall:
  stages:
    - stop
    - converse
    - high
    - medium
    - smalltalk
    - hermes
  thresholds:
    high: 0.95
    medium: 0.65
    low: 0.35
  # Medium-stage local-LLM intent classifier (OQ-5)
  classifier_model: ""        # blank = reuse LLM_MODEL from .env
  max_examples_per_skill: 5   # examples per skill fed into the auto-generated prompt
  medium_band: [0.5, 0.8]     # classifier confidence is clamped into this band
  classifier_timeout_seconds: 6.0  # a hung local LLM degrades fast, not stalls routing

skills:
  datetime:
    enabled: true
    filler: "acknowledge"
  timers:
    enabled: true
    filler: "acknowledge"
  smalltalk:
    enabled: true
    filler: "thinking"
    gate: true             # abstain for agent-class utterances → they fall to Hermes (FR-033)
  hermes:
    enabled: true
    filler: "working"      # query-appropriate opening before a run (set "none" to disable)
  stop:
    enabled: true

# Latency masking — spoken fillers while a slow stage works (US4).
# Pre-rendered audio is used ONLY for the wakeword acknowledge; everything here
# is generated and spoken via TTS on the fly.
latency:
  filler_mode: "hybrid"         # pool | llm | hybrid — how filler lines are produced
  filler_interval_seconds: 3.0  # gap before the first follow-up while waiting
  filler_backoff: true          # widen the gap after each follow-up (3 → ~5 → ~8s)
  filler_max: 3                 # max follow-up lines (0 disables, -1 = unlimited)
